name: Feature Request
description: Suggest an idea or enhancement for OmniGlyph
title: "[Feature]: "
labels:
  - enhancement
  - triage

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

        Please search existing issues first:
        https://github.com/pshycodr/omniglyph/issues

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other approaches.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not already been requested.
          required: true
