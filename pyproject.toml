[project]
name = "OmniGlyph"
version = "0.1.0"
description = "Emoji picker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rapidfuzz>=3.14.5",
    "nuitka==2.8.10",
    "pygobject>=3.54.5",
    "ruff>=0.15.14",
    "pre-commit>=4.6.0",
    "tomli-w>=1.2.0",
    "pytest>=9.1.1",
    "pytest-xvfb>=3.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "widget: requires GTK display (run under xvfb-run)",
]
filterwarnings = [
    "ignore::DeprecationWarning:gi.overrides",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
